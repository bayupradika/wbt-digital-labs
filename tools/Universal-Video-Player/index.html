<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Player & Rotator - WBT Digital Labs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: #070913; color: #f8fafc; min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, rgba(99,102,241,0.15) 0%, transparent 50%),
                              radial-gradient(circle at 80% 50%, rgba(236,72,153,0.1) 0%, transparent 40%);
            display: flex; flex-direction: column; align-items: center; padding: 40px 24px;
        }
        
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-family: 'Outfit', sans-serif; font-size: 42px; font-weight: 900; background: linear-gradient(135deg, #f43f5e, #fb923c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
        .header p { color: #94a3b8; max-width: 600px; margin: 0 auto; line-height: 1.6; }
        
        .control-panel {
            background: rgba(15,23,42,0.6); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
            padding: 30px; width: 100%; max-width: 800px; margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .input-group { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
        .url-input {
            flex-grow: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 14px; padding: 14px 20px; color: white; outline: none; font-size: 15px; transition: all 0.3s;
            min-width: 250px;
        }
        .url-input:focus { border-color: #f43f5e; box-shadow: 0 0 15px rgba(244,63,94,0.2); }
        .btn-load {
            background: linear-gradient(135deg, #f43f5e, #fb923c); color: white; border: none;
            border-radius: 14px; padding: 14px 28px; font-weight: 700; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; gap: 8px; font-size: 15px;
        }
        .btn-load:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(244,63,94,0.3); }

        .rotation-controls {
            display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
            padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .btn-rotate {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #cbd5e1; padding: 10px 20px; border-radius: 12px; cursor: pointer;
            transition: all 0.2s; font-weight: 600; display: flex; align-items: center; gap: 8px;
        }
        .btn-rotate:hover { background: rgba(255,255,255,0.1); color: white; }
        .btn-rotate.active { background: rgba(244,63,94,0.2); border-color: #f43f5e; color: #f43f5e; }

        .player-wrapper {
            width: 100%; max-width: 800px;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; border-radius: 20px; background: #000;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            position: relative;
            aspect-ratio: 16 / 9;
            transition: aspect-ratio 0.3s ease, max-width 0.3s ease;
        }
        
        .player-container {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        iframe, video {
            width: 100%; height: 100%; border: none;
            position: absolute; top: 0; left: 0; outline: none;
        }

        .back-btn {
            position: absolute; top: 24px; left: 24px; color: #94a3b8; text-decoration: none;
            display: flex; align-items: center; gap: 8px; font-weight: 600; transition: color 0.2s;
        }
        .back-btn:hover { color: white; }

        .placeholder-text { color: #475569; font-weight: 600; font-size: 18px; position: absolute; z-index: 0; display: flex; flex-direction: column; align-items: center;}
    </style>
</head>
<body>
    <a href="../../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali ke WBT Digital Labs</a>
    
    <div class="header">
        <h1>Universal Video Player & Rotator</h1>
        <p>Putar video dari YouTube, Facebook, Instagram, TikTok, atau link file .mp4 langsung tanpa iklan. Sesuaikan orientasi/rotasi video jika direkam dengan posisi miring atau terbalik.</p>
    </div>

    <div class="control-panel">
        <div class="input-group">
            <input type="text" id="yt-url" class="url-input" placeholder="Tempel link YouTube, FB, IG, TikTok, atau link .mp4 di sini...">
            <button class="btn-load" onclick="loadVideo()"><i class="fa-solid fa-play"></i> Putar Video</button>
        </div>
        
        <div class="rotation-controls">
            <button class="btn-rotate active" onclick="rotateVideo(0)" id="rot-0"><i class="fa-solid fa-rotate-right"></i> Normal (0°)</button>
            <button class="btn-rotate" onclick="rotateVideo(90)" id="rot-90"><i class="fa-solid fa-rotate-right"></i> 90° Kanan</button>
            <button class="btn-rotate" onclick="rotateVideo(180)" id="rot-180"><i class="fa-solid fa-rotate-right"></i> 180° Terbalik</button>
            <button class="btn-rotate" onclick="rotateVideo(270)" id="rot-270"><i class="fa-solid fa-rotate-left"></i> 90° Kiri</button>
        </div>
    </div>

    <div class="player-wrapper" id="playerWrapper">
        <div class="placeholder-text" id="placeholder">
            <div style="display:flex; gap:15px; margin-bottom:15px; font-size:36px; color:#334155; justify-content:center;">
                <i class="fa-brands fa-youtube"></i>
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-tiktok"></i>
                <i class="fa-solid fa-file-video"></i>
            </div>
            Masukkan link untuk memutar
        </div>
        <div class="player-container" id="playerContainer">
            <!-- Iframe or Video will be injected here -->
        </div>
    </div>

    <script>
        let currentRotation = 0;

        function extractVideoID(url) {
            // YouTube
            const ytRegExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const ytMatch = url.match(ytRegExp);
            if (ytMatch && ytMatch[2].length === 11) return { type: 'youtube', id: ytMatch[2] };

            // Facebook (Reels or Video)
            if (url.includes('facebook.com') || url.includes('fb.watch')) {
                return { type: 'facebook', url: url };
            }

            // TikTok
            if (url.includes('tiktok.com')) {
                const tkMatch = url.match(/video\/(\d+)/);
                if (tkMatch) return { type: 'tiktok', id: tkMatch[1] };
                return { type: 'tiktok_unsupported', url: url }; // Needs specific video ID
            }

            // Instagram
            if (url.includes('instagram.com')) {
                const igMatch = url.match(/\/p\/([^\/?#]+)/) || url.match(/\/reel\/([^\/?#]+)/);
                if (igMatch) return { type: 'instagram', id: igMatch[1] };
            }

            // Direct File (.mp4, .webm, etc or generic)
            if (url.match(/\.(mp4|webm|ogg)$/i) || url.startsWith('http')) {
                return { type: 'direct', url: url };
            }

            return null;
        }

        function loadVideo() {
            const urlInput = document.getElementById('yt-url').value.trim();
            const media = extractVideoID(urlInput);
            const container = document.getElementById('playerContainer');
            const placeholder = document.getElementById('placeholder');
            
            if (media) {
                placeholder.style.display = 'none';
                
                if (media.type === 'youtube') {
                    container.innerHTML = `<iframe src="https://www.youtube.com/embed/${media.id}?autoplay=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                } else if (media.type === 'facebook') {
                    // Using Facebook's official iframe player with show_text=false to hide captions/account name covering subtitles
                    const fbUrl = encodeURIComponent(media.url);
                    container.innerHTML = `<iframe src="https://www.facebook.com/plugins/video.php?href=${fbUrl}&show_text=false&width=auto" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`;
                } else if (media.type === 'tiktok') {
                    container.innerHTML = `<iframe src="https://www.tiktok.com/embed/v2/${media.id}" allow="fullscreen" title="TikTok Player" frameborder="0"></iframe>`;
                } else if (media.type === 'instagram') {
                    container.innerHTML = `<iframe src="https://www.instagram.com/p/${media.id}/embed/captioned/?cr=1&v=14&wp=1080&rd=https%3A%2F%2Fbayupradika.github.io" allowtransparency="true" allowfullscreen="true" frameborder="0" scrolling="no"></iframe>`;
                } else if (media.type === 'direct' || media.type === 'tiktok_unsupported') {
                    // Fallback to native video player for direct files or generic links
                    container.innerHTML = `<video src="${media.url}" controls autoplay playsinline preload="metadata" style="max-height:100%; max-width:100%;"></video>`;
                }
                
                rotateVideo(0); // Reset rotation on load
            } else {
                alert("Tautan video tidak valid atau tidak didukung. Harap masukkan tautan YouTube, FB, IG, TikTok, atau .mp4 yang benar.");
            }
        }

        function rotateVideo(deg) {
            currentRotation = deg;
            const container = document.getElementById('playerContainer');
            const wrapper = document.getElementById('playerWrapper');
            
            // Update active button state
            document.querySelectorAll('.btn-rotate').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`rot-${deg}`).classList.add('active');

            if (deg === 90 || deg === 270) {
                wrapper.style.aspectRatio = '9 / 16';
                wrapper.style.maxWidth = '450px';
                
                container.style.transform = `rotate(${deg}deg)`;
                container.style.width = '177.778%'; 
                container.style.height = '56.25%'; 
            } else {
                wrapper.style.aspectRatio = '16 / 9';
                wrapper.style.maxWidth = '800px';
                
                container.style.transform = `rotate(${deg}deg)`;
                container.style.width = '100%';
                container.style.height = '100%';
            }
        }
    </script>
</body>
</html>
