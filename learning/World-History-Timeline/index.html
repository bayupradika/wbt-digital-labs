<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D World History Globe</title>
  <link rel="canonical" href="https://bayupradika.github.io/wbt-digital-labs/learning/World-History-Timeline/" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    
    body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #000; overflow: hidden; color: white; }
    
    /* Header Overlay */
    .wbt-global-header {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(15,23,42,0.85); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 99px; 
      padding: 10px 24px; width: 90%; max-width: 900px;
      display: flex; justify-content: space-between; align-items: center; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .wbt-global-header a { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; font-weight: 800; }
    .wbt-global-header img { height: 34px; }
    
    /* Globe Container */
    #globeViz { width: 100vw; height: 100vh; }
    
    /* Timeline Controls Overlay */
    .timeline-panel {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(15,23,42,0.9); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 24px;
      padding: 20px 40px; width: 90%; max-width: 800px;
      text-align: center; box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
    }
    .year-display { font-size: 48px; font-weight: 800; color: #fbbf24; text-shadow: 0 0 15px rgba(251,191,36,0.5); margin-bottom: 10px; }
    
    /* Slider */
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #fbbf24; cursor: pointer; margin-top: -10px; box-shadow: 0 0 10px #fbbf24; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #475569; border-radius: 2px; }
    
    /* Info Card (Hover) */
    .info-card {
      position: absolute; top: 100px; right: 20px; z-index: 10;
      background: rgba(15,23,42,0.95); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 16px; padding: 20px; width: 320px;
      display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }
    .info-card.active { display: block; }
    .info-flag { font-size: 40px; margin-bottom: 10px; }
    .info-title { font-size: 22px; font-weight: 800; color: #fbbf24; margin-bottom: 8px; }
    .info-desc { font-size: 13px; color: #cbd5e1; line-height: 1.5; }
    
    .loading-screen {
      position: absolute; top:0; left:0; width:100vw; height:100vh;
      background: #000; z-index: 99999; display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #fbbf24;
    }
  </style>
</head>
<body>

<div class="loading-screen" id="loading">
  <i class="fa-solid fa-earth-americas fa-spin" style="font-size: 60px; margin-bottom: 20px;"></i>
  <h2>Memuat Peta Satelit 3D...</h2>
</div>

<header class="wbt-global-header">
  <a href="https://bayupradika.github.io/wbt-digital-labs/">
    <img alt="WBT Logo" src="../../assets/img/wbt-logo.png" onerror="this.src='https://via.placeholder.com/34'"/>
    <div>3D History Globe</div>
  </a>
  <div style="color: #a855f7; font-size: 13px; font-weight: 800;"><i class="fa-solid fa-globe"></i> Mode Interaktif</div>
</header>

<div id="globeViz"></div>

<div class="info-card" id="infoCard">
  <div class="info-flag" id="i-flag">🇮🇩</div>
  <div class="info-title" id="i-title">Nama Negara</div>
  <div class="info-desc" id="i-desc">Detail sejarah pada tahun tersebut.</div>
</div>

<div class="timeline-panel">
  <div class="year-display" id="yearVal">2000 M</div>
  <input type="range" id="yearSlider" min="0" max="2026" step="50" value="2000">
  <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color:#9ca3af; font-weight:600;">
    <span>0 M</span><span>500 M</span><span>1000 M</span><span>1500 M</span><span>2026 M</span>
  </div>
</div>

<script>
  let currentYear = 2000;
  let worldData = null;
  
  // Database Sejarah Sederhana (Mapping kode negara modern ke entitas sejarah)
  function getCountryState(id, modernName, year) {
    // Default fallback
    let state = {
      name: modernName || "Wilayah Tidak Diketahui",
      flag: "🏳️",
      color: "#334155",
      desc: "Belum ada catatan negara modern besar yang mendominasi wilayah ini pada tahun " + year + "."
    };
    
    // INDONESIA (IDN)
    if (id === 'IDN') {
      if (year >= 1945) {
        state.name = "Republik Indonesia"; state.flag = "🇮🇩"; state.color = "#dc2626";
        state.desc = "Diproklamasikan pada 17 Agustus 1945, menyatukan ribuan pulau nusantara menjadi satu negara kesatuan berdaulat penuh.";
      } else if (year >= 1942 && year < 1945) {
        state.name = "Pendudukan Kekaisaran Jepang"; state.flag = "🇯🇵"; state.color = "#991b1b";
        state.desc = "Wilayah nusantara diduduki oleh militer Kekaisaran Jepang selama Perang Dunia II.";
      } else if (year >= 1800 && year < 1942) {
        state.name = "Hindia Belanda (VOC / Koloni)"; state.flag = "🇳🇱"; state.color = "#ea580c";
        state.desc = "Seluruh kepulauan disatukan secara administratif di bawah pemerintahan kolonial Belanda.";
      } else if (year >= 1293 && year < 1527) {
        state.name = "Kemaharajaan Majapahit"; state.flag = "☀️"; state.color = "#f59e0b";
        state.desc = "Berpusat di Jawa, salah satu kerajaan terbesar yang menyatukan wilayah maritim Asia Tenggara.";
      } else if (year >= 650 && year < 1293) {
        state.name = "Kedatuan Sriwijaya & Kerajaan Lokal"; state.flag = "⛵"; state.color = "#059669";
        state.desc = "Wilayah nusantara masih terpisah-pisah ke dalam berbagai pulau dan kerajaan maritim kuat (seperti Sriwijaya di Sumatera).";
      } else {
        state.name = "Kerajaan Nusantara Kuno (Terpisah-pisah)"; state.flag = "🌋"; state.color = "#047857";
        state.desc = "Wilayah nusantara belum bersatu. Terdiri dari pulau-pulau yang dikuasai kerajaan lokal kuno seperti Salakanagara, Kutai, dll.";
      }
    }
    
    // INGGRIS (GBR)
    if (id === 'GBR') {
      if (year >= 1707) { state.name = "Britania Raya (British Empire)"; state.flag = "🇬🇧"; state.color = "#1d4ed8"; }
      else if (year >= 1066) { state.name = "Kerajaan Inggris (Norman)"; state.flag = "🏴󠁧󠁢󠁥󠁮󠁧󠁿"; state.color = "#2563eb"; }
      else if (year >= 400) { state.name = "Kerajaan Anglo-Saxon"; state.flag = "👑"; state.color = "#60a5fa"; }
      else { state.name = "Britannia Romawi"; state.flag = "🏛️"; state.color = "#9333ea"; }
    }
    
    // AMERIKA SERIKAT (USA)
    if (id === 'USA') {
      if (year >= 1776) { state.name = "Amerika Serikat"; state.flag = "🇺🇸"; state.color = "#2563eb"; state.desc = "Negara merdeka setelah Revolusi Amerika."; }
      else if (year >= 1600) { state.name = "13 Koloni Inggris"; state.flag = "🇬🇧"; state.color = "#1e3a8a"; }
      else { state.name = "Wilayah Suku Asli Amerika (Indian)"; state.flag = "🏕️"; state.color = "#047857"; state.desc = "Dikuasai oleh berbagai suku asli (Native Americans)."; }
    }
    
    // JEPANG (JPN)
    if (id === 'JPN') {
      if (year >= 1945) { state.name = "Jepang Modern"; state.flag = "🇯🇵"; state.color = "#dc2626"; }
      else if (year >= 1868) { state.name = "Kekaisaran Jepang (Meiji)"; state.flag = "🇯🇵"; state.color = "#991b1b"; }
      else if (year >= 1603) { state.name = "Keshogunan Tokugawa"; state.flag = "🌸"; state.color = "#f472b6"; }
      else { state.name = "Zaman Sengoku / Kamakura"; state.flag = "⚔️"; state.color = "#be185d"; }
    }
    
    // TIONGKOK (CHN)
    if (id === 'CHN') {
      if (year >= 1949) { state.name = "Republik Rakyat Tiongkok"; state.flag = "🇨🇳"; state.color = "#dc2626"; }
      else if (year >= 1912) { state.name = "Republik Tiongkok"; state.flag = "🇹🇼"; state.color = "#2563eb"; }
      else if (year >= 1644) { state.name = "Dinasti Qing"; state.flag = "🐉"; state.color = "#f59e0b"; }
      else if (year >= 1368) { state.name = "Dinasti Ming"; state.flag = "🐉"; state.color = "#d97706"; }
      else if (year >= 1271) { state.name = "Dinasti Yuan (Mongol)"; state.flag = "🐎"; state.color = "#6d28d9"; }
      else if (year >= 618) { state.name = "Dinasti Tang/Song"; state.flag = "🐉"; state.color = "#b45309"; }
      else { state.name = "Dinasti Han / Jin"; state.flag = "🐉"; state.color = "#92400e"; }
    }
    
    // RUSIA (RUS)
    if (id === 'RUS') {
      if (year >= 1991) { state.name = "Federasi Rusia"; state.flag = "🇷🇺"; state.color = "#3b82f6"; }
      else if (year >= 1922) { state.name = "Uni Soviet (USSR)"; state.flag = "☭"; state.color = "#dc2626"; }
      else if (year >= 1721) { state.name = "Kekaisaran Rusia"; state.flag = "🇷🇺"; state.color = "#fcd34d"; }
      else if (year >= 1547) { state.name = "Ketsaran Rusia"; state.flag = "👑"; state.color = "#fbbf24"; }
      else if (year >= 1240) { state.name = "Kekhanan Emas (Mongol)"; state.flag = "🐎"; state.color = "#7c3aed"; }
      else { state.name = "Kievan Rus"; state.flag = "⚔️"; state.color = "#10b981"; }
    }
    
    // ITALIA (ITA)
    if (id === 'ITA') {
      if (year >= 1946) { state.name = "Republik Italia"; state.flag = "🇮🇹"; state.color = "#10b981"; }
      else if (year >= 1861) { state.name = "Kerajaan Italia"; state.flag = "🇮🇹"; state.color = "#059669"; }
      else if (year >= 476) { state.name = "Negara Kota (Venesia, Genoa, Papal)"; state.flag = "⛵"; state.color = "#0f766e"; }
      else { state.name = "Inti Kekaisaran Romawi"; state.flag = "🏛️"; state.color = "#9333ea"; state.desc = "Pusat pemerintahan Kekaisaran Romawi Kuno."; }
    }

    return state;
  }

  // Init Globe
  const world = Globe()
    (document.getElementById('globeViz'))
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .polygonAltitude(0.01)
    .polygonSideColor(() => 'rgba(0,0,0,0.2)')
    .polygonStrokeColor(() => '#111')
    .onPolygonHover(hoverD => {
      world.polygonAltitude(d => d === hoverD ? 0.06 : 0.01);
      
      const card = document.getElementById('infoCard');
      if (hoverD) {
        const state = getCountryState(hoverD.id, hoverD.properties.name, currentYear);
        document.getElementById('i-flag').innerText = state.flag;
        document.getElementById('i-title').innerText = state.name;
        document.getElementById('i-desc').innerText = state.desc || ("Negara " + hoverD.properties.name + " pada tahun " + currentYear + ".");
        card.classList.add('active');
      } else {
        card.classList.remove('active');
      }
    });

  // Fetch GeoJSON
  fetch('countries.geojson').then(res => res.json()).then(countries => {
    worldData = countries;
    world.polygonsData(countries.features);
    updateGlobe(currentYear);
    document.getElementById('loading').style.display = 'none';
  });

  // Slider Logic
  const slider = document.getElementById('yearSlider');
  const yearVal = document.getElementById('yearVal');
  
  function updateGlobe(y) {
    world.polygonCapColor(d => {
      const state = getCountryState(d.id, d.properties.name, y);
      return state.color;
    });
  }

  slider.addEventListener('input', (e) => {
    currentYear = parseInt(e.target.value);
    yearVal.innerText = currentYear + " M";
    if (worldData) updateGlobe(currentYear);
  });
  
  // Responsive resize
  window.addEventListener('resize', () => {
    world.width(window.innerWidth).height(window.innerHeight);
  });
</script>
</body>
</html>
