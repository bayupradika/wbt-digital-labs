<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D World History Globe</title>
  <link rel="canonical" href="https://bayupradika.github.io/wbt-digital-labs/learning/World-History-Timeline/" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    
    body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #050810; overflow: hidden; color: white; }
    
    /* Header Overlay */
    .wbt-global-header {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(15,23,42,0.85); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 99px; 
      padding: 10px 24px; width: 90%; max-width: 900px;
      display: flex; justify-content: space-between; align-items: center; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .wbt-global-header a { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; font-weight: 800; }
    .wbt-global-header img { height: 34px; }
    
    /* Globe Container */
    #globeViz { width: 100vw; height: 100vh; }
    
    /* Timeline Controls Overlay */
    .timeline-panel {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(15,23,42,0.95); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 24px;
      padding: 20px 40px; width: 90%; max-width: 800px;
      text-align: center; box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
    }
    .year-display { font-size: 48px; font-weight: 800; color: #fbbf24; text-shadow: 0 0 15px rgba(251,191,36,0.5); margin-bottom: 10px; }
    
    /* Slider */
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #fbbf24; cursor: pointer; margin-top: -10px; box-shadow: 0 0 10px #fbbf24; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #475569; border-radius: 2px; }
    
    /* Info Card */
    .info-card {
      position: absolute; top: 100px; right: 20px; z-index: 10;
      background: rgba(15,23,42,0.95); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 16px; padding: 20px; width: 320px;
      display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .info-card.active { display: block; }
    .info-flag { font-size: 40px; margin-bottom: 10px; }
    .info-title { font-size: 22px; font-weight: 800; color: #fbbf24; margin-bottom: 8px; }
    .info-desc { font-size: 13px; color: #cbd5e1; line-height: 1.5; }
    
    .loading-screen {
      position: absolute; top:0; left:0; width:100vw; height:100vh;
      background: #000; z-index: 99999; display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #fbbf24;
    }
  </style>
</head>
<body>

<div class="loading-screen" id="loading">
  <i class="fa-solid fa-earth-americas fa-spin" style="font-size: 60px; margin-bottom: 20px;"></i>
  <h2>Memuat Data Geospasial...</h2>
</div>

<header class="wbt-global-header">
  <a href="https://bayupradika.github.io/wbt-digital-labs/">
    <img alt="WBT Logo" src="../../assets/img/wbt-logo.png" onerror="this.src='https://via.placeholder.com/34'"/>
    <div>3D History Globe</div>
  </a>
  <div style="color: #a855f7; font-size: 13px; font-weight: 800;"><i class="fa-solid fa-globe"></i> Mode Interaktif</div>
</header>

<div id="globeViz"></div>

<div class="info-card" id="infoCard">
  <div class="info-flag" id="i-flag">🇮🇩</div>
  <div class="info-title" id="i-title">Nama Negara</div>
  <div class="info-desc" id="i-desc">Detail sejarah pada tahun tersebut.</div>
</div>

<div class="timeline-panel">
  <div class="year-display" id="yearVal">2000 M</div>
  <input type="range" id="yearSlider" min="0" max="2026" step="50" value="2000">
  <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color:#9ca3af; font-weight:600;">
    <span>0 M</span><span>500 M</span><span>1000 M</span><span>1500 M</span><span>2026 M</span>
  </div>
</div>

<script>
  let currentYear = 2000;
  let worldData = null;
  
  // Database Sejarah Sederhana
  function getCountryState(id, modernName, year) {
    let state = {
      name: modernName || "Wilayah Tidak Diketahui",
      flag: "🏳️",
      color: "rgba(51, 65, 85, 0.6)", // transparan slate
      desc: "Tidak ada catatan negara modern dominan pada tahun " + year + "."
    };
    
    // INDONESIA (IDN)
    if (id === 'IDN') {
      if (year >= 1945) {
        state.name = "Republik Indonesia"; state.flag = "🇮🇩"; state.color = "#dc2626";
        state.desc = "Diproklamasikan pada 17 Agustus 1945, menyatukan nusantara menjadi negara kesatuan.";
      } else if (year >= 1942 && year < 1945) {
        state.name = "Pendudukan Kekaisaran Jepang"; state.flag = "🇯🇵"; state.color = "#991b1b";
        state.desc = "Wilayah nusantara diduduki oleh militer Jepang selama Perang Dunia II.";
      } else if (year >= 1800 && year < 1942) {
        state.name = "Hindia Belanda (VOC / Koloni)"; state.flag = "🇳🇱"; state.color = "#ea580c";
        state.desc = "Seluruh kepulauan disatukan secara administratif di bawah pemerintahan kolonial Belanda.";
      } else if (year >= 1293 && year < 1527) {
        state.name = "Kemaharajaan Majapahit"; state.flag = "☀️"; state.color = "#f59e0b";
        state.desc = "Kerajaan terbesar yang menyatukan wilayah maritim Asia Tenggara.";
      } else if (year >= 650 && year < 1293) {
        state.name = "Kedatuan Sriwijaya & Kerajaan Lokal"; state.flag = "⛵"; state.color = "#059669";
        state.desc = "Kerajaan maritim kuat seperti Sriwijaya mendominasi perdagangan Sumatera & Jawa.";
      } else {
        state.name = "Kerajaan Nusantara Kuno (Terpisah)"; state.flag = "🌋"; state.color = "#047857";
        state.desc = "Terdiri dari pulau-pulau yang dikuasai kerajaan lokal seperti Salakanagara, Kutai, dll.";
      }
    }
    // INGGRIS (GBR)
    else if (id === 'GBR') {
      if (year >= 1707) { state.name = "Britania Raya (British Empire)"; state.flag = "🇬🇧"; state.color = "#1d4ed8"; }
      else if (year >= 1066) { state.name = "Kerajaan Inggris (Norman)"; state.flag = "🏴󠁧󠁢󠁥󠁮󠁧󠁿"; state.color = "#2563eb"; }
      else { state.name = "Kerajaan Anglo-Saxon / Romawi"; state.flag = "👑"; state.color = "#60a5fa"; }
    }
    // AMERIKA SERIKAT (USA)
    else if (id === 'USA') {
      if (year >= 1776) { state.name = "Amerika Serikat"; state.flag = "🇺🇸"; state.color = "#2563eb"; }
      else if (year >= 1600) { state.name = "13 Koloni Inggris"; state.flag = "🇬🇧"; state.color = "#1e3a8a"; }
      else { state.name = "Wilayah Suku Asli Amerika (Indian)"; state.flag = "🏕️"; state.color = "#047857"; }
    }
    // JEPANG (JPN)
    else if (id === 'JPN') {
      if (year >= 1945) { state.name = "Jepang Modern"; state.flag = "🇯🇵"; state.color = "#dc2626"; }
      else if (year >= 1868) { state.name = "Kekaisaran Jepang (Meiji)"; state.flag = "🇯🇵"; state.color = "#991b1b"; }
      else { state.name = "Keshogunan / Zaman Sengoku"; state.flag = "🌸"; state.color = "#f472b6"; }
    }
    // TIONGKOK (CHN)
    else if (id === 'CHN') {
      if (year >= 1949) { state.name = "Republik Rakyat Tiongkok"; state.flag = "🇨🇳"; state.color = "#dc2626"; }
      else if (year >= 1912) { state.name = "Republik Tiongkok"; state.flag = "🇹🇼"; state.color = "#2563eb"; }
      else if (year >= 1644) { state.name = "Dinasti Qing"; state.flag = "🐉"; state.color = "#f59e0b"; }
      else if (year >= 1368) { state.name = "Dinasti Ming"; state.flag = "🐉"; state.color = "#d97706"; }
      else { state.name = "Dinasti Han / Tang / Song / Yuan"; state.flag = "🐉"; state.color = "#b45309"; }
    }
    // RUSIA (RUS)
    else if (id === 'RUS') {
      if (year >= 1991) { state.name = "Federasi Rusia"; state.flag = "🇷🇺"; state.color = "#3b82f6"; }
      else if (year >= 1922) { state.name = "Uni Soviet (USSR)"; state.flag = "☭"; state.color = "#dc2626"; }
      else if (year >= 1721) { state.name = "Kekaisaran Rusia"; state.flag = "🇷🇺"; state.color = "#fcd34d"; }
      else { state.name = "Ketsaran Rusia / Kievan Rus"; state.flag = "👑"; state.color = "#fbbf24"; }
    }
    // MESIR (EGY)
    else if (id === 'EGY') {
      if (year >= 1922) { state.name = "Mesir Modern"; state.flag = "🇪🇬"; state.color = "#fcd34d"; }
      else if (year >= 1517) { state.name = "Eyalet Mesir (Ottoman)"; state.flag = "🌙"; state.color = "#d97706"; }
      else { state.name = "Mesir Kuno / Romawi / Fatimiyah"; state.flag = "🏺"; state.color = "#b45309"; }
    }

    return state;
  }

  // Init Globe (No texture image to ensure it loads instantly and borders are always visible)
  const world = Globe()
    (document.getElementById('globeViz'))
    .backgroundColor('#050810')
    .showGlobe(true)
    .showAtmosphere(true)
    .atmosphereColor('#3a228a')
    .atmosphereAltitude(0.15)
    .globeColor('#0f172a') // solid dark blue/gray base
    .polygonAltitude(0.015) // Slightly raised so it doesn't clip
    .polygonSideColor(() => 'rgba(0,0,0,0.1)')
    .polygonStrokeColor(() => '#cbd5e1') // White outlines so countries are always visible!
    .onPolygonHover(hoverD => {
      world.polygonAltitude(d => d === hoverD ? 0.05 : 0.015);
      
      const card = document.getElementById('infoCard');
      if (hoverD) {
        const state = getCountryState(hoverD.id, hoverD.properties.name, currentYear);
        document.getElementById('i-flag').innerText = state.flag;
        document.getElementById('i-title').innerText = state.name;
        document.getElementById('i-desc').innerText = state.desc || ("Negara " + hoverD.properties.name + " pada tahun " + currentYear + ".");
        card.classList.add('active');
      } else {
        card.classList.remove('active');
      }
    });

  // Fetch GeoJSON
  fetch('countries.geojson').then(res => res.json()).then(countries => {
    worldData = countries;
    world.polygonsData(countries.features);
    updateGlobe(currentYear);
    
    // Auto-rotate the globe slowly for better visual effect
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
    
    document.getElementById('loading').style.display = 'none';
  });

  // Force re-render of colors when slider moves
  const slider = document.getElementById('yearSlider');
  const yearVal = document.getElementById('yearVal');
  
  function updateGlobe(y) {
    if (!worldData) return;
    // We update the cap color function, then we must re-feed the data to force a hard WebGL re-render
    world.polygonCapColor(d => getCountryState(d.id, d.properties.name, y).color);
    // world.polygonsData removed for instant performance
  }

  slider.addEventListener('input', (e) => {
    currentYear = parseInt(e.target.value);
    yearVal.innerText = currentYear + " M";
    updateGlobe(currentYear);
  });
  
  // Responsive resize
  window.addEventListener('resize', () => {
    world.width(window.innerWidth).height(window.innerHeight);
  });
</script>
<!-- Donation Footer -->
<div id="donation-footer" style="position: absolute; bottom: 20px; left: 20px; z-index: 20; background: rgba(15,23,42,0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 15px 20px; color: white; display: flex; flex-direction: column; gap: 10px; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
  <div style="font-size: 14px; font-weight: 700; color: #fbbf24;">
    <i class="fa-solid fa-mug-hot"></i> Traktir saya kopi <br> 
    <span style="font-size: 11px; color: #9ca3af; font-weight: 500;">(Buy me a coffee - Support this free tool)</span>
  </div>
  <div id="donation-buttons" style="display: flex; gap: 8px;">
    <button class="don-btn" data-usd="1">☕ </button>
    <button class="don-btn" data-usd="5">☕ </button>
    <button class="don-btn" data-usd="10">☕ </button>
  </div>
</div>

<style>
  .don-btn {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); 
    color: white; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; flex-grow: 1;
  }
  .don-btn:hover { background: #fbbf24; color: #0f172a; border-color: #fbbf24; }
</style>

<script>
  // Dynamic Currency Converter for Donations
  async function setupDonation() {
    try {
      // 1. Get User's Currency based on IP
      const geoRes = await fetch('https://ipapi.co/json/');
      const geoData = await geoRes.json();
      const userCurrency = geoData.currency || 'USD';
      
      // 2. Get Exchange Rate if not USD
      let rate = 1;
      if (userCurrency !== 'USD') {
        const rateRes = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
        const rateData = await rateRes.json();
        rate = rateData.rates[userCurrency] || 1;
      }
      
      // 3. Update Buttons
      const buttons = document.querySelectorAll('.don-btn');
      buttons.forEach(btn => {
        const usdValue = parseInt(btn.getAttribute('data-usd'));
        const localValue = usdValue * rate;
        
        // Format Currency
        const formatter = new Intl.NumberFormat(geoData.languages ? geoData.languages.split(',')[0] : 'en-US', {
          style: 'currency',
          currency: userCurrency,
          minimumFractionDigits: 0,
          maximumFractionDigits: 0
        });
        
        btn.innerHTML = ☕  + formatter.format(localValue);
        
        // Setup Click to Payment Gateway (Placeholder link to Mayar/Paypal)
        btn.onclick = () => {
          // Replace this with your actual Mayar/Payment link logic
          alert('Mengarahkan ke halaman pembayaran senilai ' + formatter.format(localValue) + '... Terima kasih atas dukungannya!');
        };
      });
    } catch (e) {
      console.log("Currency fetch failed, fallback to USD.", e);
    }
  }
  
  setupDonation();
</script>
</body>
</html>
