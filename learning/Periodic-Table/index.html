<!DOCTYPE html>
<html lang="id">
<head>

<script>
  // Mengambil data dari cloud langsung agar tidak kena blokir cache
  fetch('https://raw.githubusercontent.com/Bowserinator/Periodic-Table-JSON/master/PeriodicTableJSON.json')
    .then(res => res.json())
    .then(data => {
      const table = document.getElementById('ptable');
      table.innerHTML = ''; // Clear just in case
      
      data.elements.forEach(el => {
        try {
          const div = document.createElement('div');
          const cat = el.category ? el.category.replace(/\s+/g, '-') : 'unknown';
          div.className = 'element ' + cat;
          div.style.gridColumn = el.xpos || 1;
          div.style.gridRow = el.ypos || 1;
          
          div.innerHTML = 
            <div class="el-number"> + el.number + </div>
            <div class="el-symbol"> + el.symbol + </div>
            <div class="el-name"> + el.name + </div>
          ;
          
          div.onclick = () => {
            document.getElementById('m-num').innerText = el.number || '';
            document.getElementById('m-sym').innerText = el.symbol || '';
            document.getElementById('m-name').innerText = el.name || '';
            document.getElementById('m-cat').innerText = el.category || 'Unknown';
            document.getElementById('m-desc').innerText = el.summary || '';
            
            document.getElementById('m-mass').innerText = el.atomic_mass || 'N/A';
            document.getElementById('m-melt').innerText = el.melt || 'N/A';
            document.getElementById('m-boil').innerText = el.boil || 'N/A';
            document.getElementById('m-discoverer').innerText = el.discovered_by || 'Tidak diketahui';
            
            document.getElementById('m-box').className = 'modal-symbol-box ' + cat;
            document.getElementById('modal').style.display = 'flex';
          };
          
          table.appendChild(div);
        } catch(e) {
          console.error("Error creating element", el.name, e);
        }
      });
    }).catch(err => {
      document.getElementById('ptable').innerHTML = '<div style="color:white; width:100%; text-align:center;">Gagal memuat data kimia. Periksa koneksi internet Anda.</div>';
    });
</script>
</body>
</html>
